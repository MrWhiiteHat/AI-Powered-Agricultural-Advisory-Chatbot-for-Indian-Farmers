<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KrishiMitra - AI Agricultural Advisor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #1e6b4f;
            --primary-light: #2c9b74;
            --secondary: #e6f4ea;
            --dark: #1f2937;
            --light: #f9fafb;
            --white: #ffffff;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-400: #9ca3af;
            --gray-600: #4b5563;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e0f2f1 0%, #b2dfdb 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: var(--dark);
        }

        .chat-container {
            width: 100%;
            max-width: 480px;
            height: 90vh;
            max-height: 850px;
            background: var(--white);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1), 0 0 0 1px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Header */
        .chat-header {
            background: var(--primary);
            color: var(--white);
            padding: 24px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            position: relative;
            z-index: 10;
        }

        .header-bg {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none"><path fill="%232c9b74" opacity="0.3" d="M0,50 Q25,30 50,50 T100,50 L100,0 L0,0 Z"/></svg>');
            background-size: cover;
            z-index: -1;
        }

        .avatar {
            width: 50px;
            height: 50px;
            background: var(--white);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            position: relative;
        }

        .avatar::after {
            content: '';
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            background: #10b981;
            border-radius: 50%;
            border: 2px solid var(--white);
        }

        .header-info h1 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .header-info p {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        /* Messages Area */
        .messages {
            flex: 1;
            padding: 24px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: #fafafa;
        }

        .message {
            max-width: 85%;
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.5;
            position: relative;
            animation: fadeIn 0.3s ease-out forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .message.bot {
            background: var(--white);
            color: var(--dark);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid var(--gray-100);
        }

        .message.user {
            background: var(--primary);
            color: var(--white);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 12px rgba(30,107,79,0.2);
        }

        /* Convert bot markdown-like text nicely */
        .message.bot b, .message.bot strong {
            color: var(--primary);
            font-weight: 600;
        }
        
        .message.bot ul {
            margin-top: 8px;
            margin-left: 20px;
        }
        
        /* Input Area */
        .chat-input {
            padding: 20px;
            background: var(--white);
            border-top: 1px solid var(--gray-100);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
            background: var(--gray-100);
            border-radius: 24px;
            padding: 4px;
            display: flex;
            align-items: center;
            transition: all 0.2s;
            border: 1px solid transparent;
        }
        
        .input-wrapper:focus-within {
            background: var(--white);
            border-color: var(--primary-light);
            box-shadow: 0 0 0 4px var(--secondary);
        }

        input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 12px 16px;
            font-size: 1rem;
            color: var(--dark);
            outline: none;
        }

        input::placeholder {
            color: var(--gray-400);
        }

        .send-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(30,107,79,0.2);
        }

        .send-btn:hover {
            transform: scale(1.05) translateY(-2px);
            background: var(--primary-light);
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        /* Typing indicator */
        .typing {
            display: none;
            align-self: flex-start;
            background: var(--white);
            padding: 12px 18px;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid var(--gray-100);
            align-items: center;
            gap: 4px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: var(--gray-400);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; background: var(--primary); }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--gray-200); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--gray-400); }

        /* Quick Replies */
        .quick-replies {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 0 20px 16px 20px;
            background: #fafafa;
            scrollbar-width: none;
        }
        
        .quick-replies::-webkit-scrollbar { display: none; }
        
        .quick-reply {
            white-space: nowrap;
            padding: 8px 16px;
            background: var(--white);
            border: 1px solid var(--primary-light);
            color: var(--primary);
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .quick-reply:hover {
            background: var(--secondary);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <div class="header-bg"></div>
            <div class="avatar">👨‍🌾</div>
            <div class="header-info">
                <h1>KrishiMitra (कृषि मित्र)</h1>
                <p>AI Agricultural Advisor • Online</p>
            </div>
        </div>

        <!-- Messages -->
        <div class="messages" id="messages">
            <div class="message bot">
                🙏 Namaste! I am KrishiMitra, your AI farming assistant. <br><br>
                I can help you with:<br>
                ☀️ <b>Weather forecasts</b> for your crops<br>
                💰 <b>Market prices</b> (mandi rates)<br>
                📋 <b>Government schemes</b><br><br>
                How can I help you today?
            </div>
            
            <div class="typing" id="typing">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>

        <!-- Quick Replies -->
        <div class="quick-replies" id="quick-replies">
            <button class="quick-reply" onclick="sendQuickReply('Tomato price')">🍅 Tomato price</button>
            <button class="quick-reply" onclick="focusInput()">☀️ Weather today</button>
            <button class="quick-reply" onclick="sendQuickReply('Govt schemes for farmers')">📋 Govt schemes</button>
            <button class="quick-reply" onclick="sendQuickReply('भाषा हिंदी')">हिंदी 🇮🇳</button>
        </div>

        <!-- Input Area -->
        <div class="chat-input">
            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="Ask your farming question..." autocomplete="off" onkeypress="handleEnter(event)">
            </div>
            <button class="send-btn" onclick="sendMessage()">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <script>
        const messagesEl = document.getElementById("messages");
        const typingEl = document.getElementById("typing");
        const inputEl = document.getElementById("userInput");

        function formatBotResponse(text) {
            // Very simple formatting for bold text (from Markdown)
            let formatted = text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
            formatted = formatted.replace(/\*(.*?)\*/g, '<i>$1</i>');
            // Format line breaks
            formatted = formatted.replace(/\n/g, '<br>');
            return formatted;
        }

        function appendMessage(text, type) {
            const div = document.createElement("div");
            div.className = `message ${type}`;
            div.innerHTML = type === 'bot' ? formatBotResponse(text) : text;
            messagesEl.insertBefore(div, typingEl);
            scrollToBottom();
        }

        function scrollToBottom() {
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function handleEnter(e) {
            if (e.key === "Enter") sendMessage();
        }

        function focusInput() {
            inputEl.value = "Weather today in Pune";
            inputEl.focus();
        }

        function sendQuickReply(text) {
            inputEl.value = text;
            sendMessage();
        }

        async function sendMessage() {
            const text = inputEl.value.trim();
            if (!text) return;

            // Add user message
            appendMessage(text, "user");
            inputEl.value = "";
            inputEl.blur();

            // Show typing indicator
            typingEl.style.display = "flex";
            scrollToBottom();

            try {
                // Call actual FastAPI endpoint
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: text, phone: "web_user_" + Math.random().toString(36).substr(2, 5) })
                });
                
                const data = await response.json();
                
                // Hide typing & add bot message
                typingEl.style.display = "none";
                appendMessage(data.reply, "bot");
                
            } catch (err) {
                typingEl.style.display = "none";
                appendMessage("⚠️ Connection error. Please try again.", "bot");
            }
        }
    </script>
</body>
</html>
